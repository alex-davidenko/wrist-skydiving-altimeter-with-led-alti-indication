; Wrist-mounted skydiving altimeter — ESP32-S3 + MS5611 (GY-63)
; See README.md for wiring and bring-up procedure.
;
; Two firmware environments, same source, one flag apart:
;
;   bench   metre-scale thresholds, for testing by hand on a desk
;   flight  the real skydiving thresholds — THIS is what you jump with
;
; They are separate environments rather than separate branches deliberately: a
; production branch would diverge from this one and need merging forever, while
; a build flag cannot drift. The names are spelled out rather than encoded in a
; board name so the wrong one is hard to pick by accident in the IDE sidebar.

[platformio]
default_envs = bench

; ---------------------------------------------------------------------------
; Shared board configuration. Waveshare ESP32-S3-Touch-LCD-1.47:
; ESP32-S3R8, 16 MB flash, 8 MB octal PSRAM, 172x320 JD9853 + touch, SD slot.
; ---------------------------------------------------------------------------
[s3board]
platform  = espressif32
board     = esp32-s3-devkitc-1
framework = arduino

monitor_speed   = 115200
monitor_filters = time, colorize

board_build.flash_size          = 16MB
board_upload.flash_size         = 16MB
board_build.partitions          = default_16MB.csv
; ESP32-S3R8 = octal PSRAM, so flash stays QIO while PSRAM runs OPI.
board_build.arduino.memory_type = qio_opi

lib_deps =
    robtillaart/MS5611@^0.5.2
    adafruit/Adafruit NeoPixel@^1.12.3
    ; Pinned, not floating: 1.6.x switched to the Arduino core 3.x peripheral
    ; manager (esp32-hal-periman.h) and will not build against the core 2.0.17
    ; that platform espressif32 6.10 ships. 1.5.9 is also the exact version
    ; Waveshare validated on this board.
    moononournation/GFX Library for Arduino@1.5.9

build_flags =
    -Wall
    -D BOARD_HAS_PSRAM
    ; This board has ONE USB-C socket wired to the S3's native USB. There is no
    ; UART bridge, so Serial must be CDC-over-USB or you get silence.
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

; ---------------------------------------------------------------------------
; BENCH — thresholds divided by 1000 so the zone logic can be exercised by
; lifting the board by hand. Not for jumping: at bench scale a real exit
; altitude sits above every band and the colours never change.
;   .venv/bin/pio run -e bench --target upload
; ---------------------------------------------------------------------------
[env:bench]
extends = s3board
build_flags = ${s3board.build_flags} -D BENCH_MODE=1

; ---------------------------------------------------------------------------
; FLIGHT — the real thresholds. This is the build that goes in the aircraft.
;   .venv/bin/pio run -e flight --target upload
; ---------------------------------------------------------------------------
[env:flight]
extends = s3board
build_flags = ${s3board.build_flags} -D BENCH_MODE=0

; ---------------------------------------------------------------------------
; Host-side unit tests for the filter + zone state machine (no hardware).
;   .venv/bin/pio test -e native
; ---------------------------------------------------------------------------
[env:native]
platform  = native
build_flags = -std=gnu++17 -Wall
test_framework = unity
